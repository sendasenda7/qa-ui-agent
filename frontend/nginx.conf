server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Appli monopage (react-router) : toute adresse inconnue renvoie index.html,
  # sinon recharger la page sur /reports/123 donnerait une erreur 404.
  location / {
    try_files $uri /index.html;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
